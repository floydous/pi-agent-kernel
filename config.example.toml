# Agent Kernel - Configuration Example
# Copy to `.pi/config.toml` (workspace) or `~/.pi/agent/config.toml` (global).
# All fields are optional; defaults apply when omitted.

[retrieval]
# "auto" (VPS=lean, laptop=hybrid, desktop=full), "lean" (BM25 only),
# "hybrid" (BM25 + 256d vectors), "full" (768d dense vectors), or "off"
default_profile = "lean"
max_search_results = 5

[safety]
enable_epistemic_guard = true
max_line_length = 300
max_lines = 100
max_total_bytes = 20480
exec_timeout_ms = 5000

[editing]
mode = "smart_anchor"
default_anchors = true
read_mode = "auto"

[ui]
enable_pastel_footer = true

[instructions]
enabled = true
pi_docs = true
