# Unified Pi Agent Kernel & Web Tools Configuration
# Place this file in ~/.pi/agent/config.toml (user global) or .pi/config.toml (project-local)

[retrieval]
# Codebase retrieval profile:
# "lean" (BM25 only)
# "hybrid" (BM25 + 256d Embeddings)
# "full" (BM25 + 384d Embeddings)

default_profile = "lean"

# Token budget cap for PageRank-ranked repository map
repo_map_budget = 1024

# Number of relevant AST code chunks returned by code_search
max_search_results = 5

[safety]
# Enforce read-before-write safety checks
enable_epistemic_guard = true

# Terminal output clamping thresholds to prevent prompt context blowout
max_line_length = 300
max_lines = 40
max_total_bytes = 20480

# Subprocess execution timeout (ms)
exec_timeout_ms = 5000

[lsp]
# Auto-shutdown idle LSP background daemons (ms) - 5 minutes = 300000
idle_timeout_ms = 300000

# Modal animated ASCII braille spinner update interval (ms)
spinner_interval_ms = 80

# Explicitly disabled LSP servers by language identifier (e.g. ["php", "ruby"])
disabled_servers = []

[ui]
# Enable 24-bit TrueColor pastel statusline footer
enable_pastel_footer = true

