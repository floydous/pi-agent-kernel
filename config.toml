[retrieval]
default_profile = "full"
repo_map_budget = 1024
max_search_results = 5
codebase_profile = "auto"

[safety]
enable_epistemic_guard = true
max_line_length = 300
max_lines = 40
max_total_bytes = 20480
exec_timeout_ms = 5000

[editing]
mode = "smart_anchor"
default_anchors = true
read_mode = "auto"

[lsp]
idle_timeout_ms = 300000
spinner_interval_ms = 80
disabled_servers = []

[ui]
enable_pastel_footer = true

[instructions]
enabled = true
pi_docs = true
