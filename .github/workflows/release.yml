name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Publish package via Trusted Publisher
        run: npm publish --provenance --access public

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            node -e '
              const fs = require("fs");
              const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
              const cl = fs.readFileSync("CHANGELOG.md", "utf8");
              const startIdx = cl.search(new RegExp("## \\[" + tag.replace(/\./g, "\\.") + "\\]"));
              if (startIdx === -1) {
                fs.writeFileSync("RELEASE_NOTES.tmp", cl.slice(0, 2000));
                process.exit(0);
              }
              const rest = cl.slice(startIdx);
              const nextIdx = rest.slice(1).search(/## \[/);
              const section = nextIdx !== -1 ? rest.slice(0, nextIdx + 1).trim() : rest.trim();
              fs.writeFileSync("RELEASE_NOTES.tmp", section);
            '
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.tmp
            rm -f RELEASE_NOTES.tmp
          fi
